name: Apply clang-tidy fixes

on:
  # Weekly, not per push: every run opens a pull request, and create-pull-request reuses one
  # branch, so each run updates that pull request instead of opening another.
  #  push: { }
  #  pull_request: { }
  schedule:
    - cron: '23 2 * * 1'
      timezone: Europe/Berlin
  workflow_dispatch: { }

# `create-pull-request` pushes a branch and opens a pull request, and the repository's
# default token is read-only. This block cannot grant the repository setting "Allow GitHub
# Actions to create and approve pull requests"; while that is off the last step fails with
# "GitHub Actions is not permitted to create or approve pull requests" regardless.
permissions:
  contents: write
  pull-requests: write

jobs:
  clang-tidy:
    runs-on: ubuntu-26.04
    # Never run, so nothing is measured. This builds the submodules serially and uncached
    # where the matrix builds them in parallel against a warm ccache in 34 min.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"

      # The action the build matrix uses, so clang-tidy analyses against the Boost the matrix
      # compiles against instead of a second, apt-provided one. It also brings ninja.
      - name: Setup needed software
        uses: ./.github/actions/setup
        with:
          os: ubuntu-26.04
          cxx: clang++
          cxx-standard: 17
          # Only master's matrix entries are restorable from every ref, and this job's Debug
          # build has nothing the matrix could restore, so it writes none.
          save-ccache: 'false'

      # After the action above, which is where the apt index was last refreshed.
      - name: Setup clang-tidy
        run: sudo apt-get install -y clang-tidy

      # The preset is report-only, so --fix is passed here, where a -D overrides the cache
      # variable: this is the one place that means to rewrite sources.
      - name: Running clang-tidy
        run: |
          cmake --preset clang-tidy \
            -DRKE_CLANG_TIDY_OPTIONS=--fix \
            -DCMAKE_CXX_COMPILER=clang++
          cmake --build --preset clang-tidy -j 1 --verbose

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: clang-tidy-fixes-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          # The action stages everything it finds, and the job leaves a compiler cache and a
          # build tree in the workspace. Only clang-tidy's own fixes belong in the pull request.
          add-paths: src/**
          delete-branch: true
          commit-message: "Automated fixes by clang-tidy"
          title: "Automated fixes by clang-tidy"
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          body: >
            This is an automated PR generated by the
            [create-pull-request](https://github.com/peter-evans/create-pull-request)
            GitHub action.

            Please review the changes before merging.

name: Apply clang-tidy fixes

on:
  # Dispatch only: every run opens a pull request, so a push or pull_request trigger would
  # open one per push.
  #  push: { }
  #  pull_request: { }
  workflow_dispatch: { }

# `create-pull-request` pushes a branch and opens a pull request, and the repository's
# default token is read-only. This block cannot grant the repository setting "Allow GitHub
# Actions to create and approve pull requests"; while that is off the last step fails with
# "GitHub Actions is not permitted to create or approve pull requests" regardless.
permissions:
  contents: write
  pull-requests: write

jobs:
  clang-tidy:
    runs-on: ubuntu-26.04
    # Never run, so nothing is measured. This builds the submodules serially and uncached
    # where the matrix builds them in parallel against a warm ccache in 34 min.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"

      - name: Setup
        run: |
          sudo apt update
          sudo apt install -y clang-tidy ninja-build

      - name: Running clang-tidy
        run: |
          cmake -S . -B ./build -G Ninja \
            -DRKE_USE_CLANG_TIDY=ON -DRKE_CLANG_TIDY_OPTIONS=--fix \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++
          cmake --build ./build -j 1 -v

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: clang-tidy-fixes-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          delete-branch: true
          commit-message: "Automated fixes by clang-tidy"
          title: "Automated fixes by clang-tidy"
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          body: >
            This is an automated PR generated by the
            [create-pull-request](https://github.com/peter-evans/create-pull-request)
            GitHub action.

            Please review the changes before merging.

name: Apply clang-tidy fixes

on:
  #  push: { }
  #  pull_request: { }
  workflow_dispatch: { }

# `create-pull-request` pushes a branch and opens a pull request. The repository's default
# token is read-only, so both of these are needed; the action's README asks for exactly
# them and nothing more.
#
# This block cannot switch on "Allow GitHub Actions to create and approve pull requests".
# That is a repository setting, and while it is off the last step fails with
# "GitHub Actions is not permitted to create or approve pull requests" no matter what is
# granted here.
permissions:
  contents: write
  pull-requests: write

jobs:
  clang-tidy:
    runs-on: ubuntu-24.04
    # Never run, so there is nothing to measure. This builds the submodules serially
    # (`-j 1`, Debug, no compiler cache) where the matrix job builds them in parallel
    # against a warm ccache in 34 min, so the bound is set far above that.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"

      - name: Setup
        run: |
          sudo apt update
          sudo apt install -y clang-tidy ninja-build

      - name: Running clang-tidy
        run: |
          cmake -S . -B ./build -G Ninja -DRKE_USE_CLANG_TIDY=ON -DRKE_CLANG_TIDY_OPTIONS=--fix -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build ./build -j 1 -v

      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: clang-tidy-fixes-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          delete-branch: true
          commit-message: "Automated fixes by clang-tidy"
          title: "Automated fixes by clang-tidy"
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          body: |
            This is an automated PR generated by the [create-pull-request](https://github.com/peter-evans/create-pull-request) GitHub action.
            Please review the changes before merging.

name: Apply clang-tidy fixes

# No push or pull_request on purpose: the run rewrites sources and opens a pull request, so a
# PR trigger would stack pull requests on pull requests.
on:
  schedule:
    - cron: '23 2 * * 1'
      timezone: Europe/Berlin
  workflow_dispatch: { }

# Necessary but not sufficient: opening the pull request also needs the repository setting
# "Allow GitHub Actions to create and approve pull requests", which no permissions block grants.
permissions:
  contents: write
  pull-requests: write

jobs:
  clang-tidy:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"

      - name: Setup needed software
        uses: ./.github/actions/setup
        with:
          os: ubuntu-26.04
          cxx: clang++
          cxx-standard: 17
          save-ccache: 'false'

      - name: Setup LLVM
        run: brew install llvm@23

      - name: Running clang-tidy
        run: |
          # --fix is passed here and deliberately never stored in the preset, so no local
          # `cmake --preset clang-tidy` rewrites sources by accident.
          cmake --preset clang-tidy -DRKE_CLANG_TIDY_OPTIONS=--fix
          # -j 1 is not tuning: --fix rewrites headers shared between translation units, and
          # parallel jobs corrupt each other's edits.
          cmake --build --preset clang-tidy -j 1 --verbose

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Deriving the branch from the base makes a re-run update the one open pull request
          # instead of opening a new one each time.
          branch: clang-tidy-fixes-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          # Fences the commit to our own sources, because --fix rewrites any header it reaches.
          add-paths: src/**
          delete-branch: true
          commit-message: "Automated fixes by clang-tidy"
          title: "Automated fixes by clang-tidy"
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          body: >
            This is an automated PR generated by the
            [create-pull-request](https://github.com/peter-evans/create-pull-request)
            GitHub action.

            Please review the changes before merging.

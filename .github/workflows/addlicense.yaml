name: Add missing SPDX headers

on:
  push:
    branches:
      - master
  workflow_dispatch: { }

permissions:
  contents: write
  pull-requests: write

jobs:
  addlicense:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Linux variables
        run: echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> $GITHUB_PATH

      - name: Setup addlicense
        run: |
          brew update
          brew install addlicense

      - name: Adding the missing SPDX headers
        run: |
          git ls-files '*.cpp' '*.hpp' '*.cmake' '*.yml' '*.yaml' '*CMakeLists.txt' |
            xargs -r addlicense -v -f .github/license-header.tmpl \
              -c "Ralf Konrad Eckel" -y "$(date +%Y)"

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: addlicense-fixes-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          delete-branch: true
          commit-message: "Automated SPDX headers by addlicense"
          title: "Automated SPDX headers by addlicense"
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          body: >
            This is an automated PR generated by the
            [create-pull-request](https://github.com/peter-evans/create-pull-request)
            GitHub action.

            `addlicense` writes headers into `.cpp`, `.hpp`, `.cmake`, `CMakeLists.txt`
            and the workflow files only, and dates a new file to the year this run
            happened. The Markdown and dotfile headers are maintained by hand.

            Please review the changes before merging.

name: Apply clang-format fixes

on:
  # push: { }
  # pull_request: { }
  workflow_dispatch: { }

# `create-pull-request` pushes a branch and opens a pull request. The repository's default
# token is read-only, so both of these are needed; the action's README asks for exactly
# them and nothing more.
#
# This block cannot switch on "Allow GitHub Actions to create and approve pull requests".
# That is a repository setting, and while it is off the last step fails with
# "GitHub Actions is not permitted to create or approve pull requests" no matter what is
# granted here.
permissions:
  contents: write
  pull-requests: write

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    # Never run, so there is nothing to measure. clang-format over this tree is minutes;
    # the checkout of the QuantLib submodule is the only part that can drag.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "true"

      - uses: DoozyX/clang-format-lint-action@v0.20
        with:
          clangFormatVersion: 14
          inplace: True
          # .clang-format-ignore needs clang-format 18; the action excludes via this input.
          exclude: './external'

      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: clang-format-fixes-${{ github.ref_name }}
          base: ${{ github.ref_name }}
          delete-branch: true
          commit-message: "Automated fixes by clang-format"
          title: "Automated fixes by clang-format"
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          body: |
            This is an automated PR generated by the [create-pull-request](https://github.com/peter-evans/create-pull-request) GitHub action.
            Please review the changes before merging.

name: Build and Test with CMake and CTest

on:
  # `pull_request` already builds every branch, so an unscoped `push` built each commit of an
  # open pull request twice, against the single 10GB cache quota. The cost of scoping it to
  # master is that a branch without a pull request runs nothing until one is opened.
  push:
    branches:
      - master
  pull_request: { }
  schedule:
    - cron: '33 5 * * *'
  workflow_dispatch: { }

# Declared read-only so that flipping the repository default to read-write does not hand a
# write token to cmake, brew, apt, choco and the third-party actions this matrix runs.
permissions:
  contents: read

# master must never be cancelled: its compiler caches are the only ones every other ref can
# restore from. `github.ref` is `refs/pull/<n>/merge` on a pull request, so the two never
# share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  cmake-build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # Pinned, not `*-latest`: the ccache key is built from this label, so an image
        # migration would swap the toolchain while leaving the key untouched. Dependabot does
        # not bump runner labels, so a newer image is a deliberate edit here.
        #
        # ubuntu-26.04 is still a public preview. It carries the CMake the other two images
        # already have, which is the reason to be on it; the cost is that the one image under
        # the required gate has no support commitment behind it.
        settings:
          [
            { os: macos-26,       cc: clang,    cxx: clang++ },
            { os: ubuntu-26.04,   cc: clang,    cxx: clang++ },
            { os: ubuntu-26.04,   cc: gcc,      cxx: g++ },
            { os: windows-2025,   cc: cl,       cxx: cl }

            # { os: macos-13,       cc: clang,    cxx: clang++ },
            # { os: macos-14,       cc: clang,    cxx: clang++ },
            # { os: macos-15,       cc: clang,    cxx: clang++ },
            #
            # The ubuntu-22.04 and ubuntu-24.04 images ship CMake 3.31.6, under the floor
            # CMakeLists.txt sets, so either group needs a CMake install step first.
            # { os: ubuntu-22.04,   cc: clang-13, cxx: clang++-13 },
            # { os: ubuntu-22.04,   cc: clang-14, cxx: clang++-14 },
            # { os: ubuntu-22.04,   cc: clang-15, cxx: clang++-15 },
            #
            # { os: ubuntu-22.04,   cc: gcc-10,   cxx: g++-10 },
            # { os: ubuntu-22.04,   cc: gcc-11,   cxx: g++-11 },
            # { os: ubuntu-22.04,   cc: gcc-12,   cxx: g++-12 },
            #
            # { os: ubuntu-24.04,   cc: clang-16, cxx: clang++-16 },
            # { os: ubuntu-24.04,   cc: clang-17, cxx: clang++-17 },
            # { os: ubuntu-24.04,   cc: clang-18, cxx: clang++-18 },
            #
            # { os: ubuntu-24.04,   cc: gcc-12,   cxx: g++-12 },
            # { os: ubuntu-24.04,   cc: gcc-13,   cxx: g++-13 },
            # { os: ubuntu-24.04,   cc: gcc-14,   cxx: g++-14 },
            #
            # { os: ubuntu-26.04,   cc: clang-20, cxx: clang++-20 },
            # { os: ubuntu-26.04,   cc: clang-21, cxx: clang++-21 },
            # { os: ubuntu-26.04,   cc: clang-22, cxx: clang++-22 },
            #
            # { os: ubuntu-26.04,   cc: gcc-13,   cxx: g++-13 },
            # { os: ubuntu-26.04,   cc: gcc-14,   cxx: g++-14 },
            # { os: ubuntu-26.04,   cc: gcc-15,   cxx: g++-15 },
            #
            # { os: windows-2019,   cc: cl,       cxx: cl },
            # { os: windows-2022,   cc: cl,       cxx: cl },
            # { os: windows-2025,   cc: cl,       cxx: cl }
          ]
        cxx-standard: [ 17, 20, 23 ]
        cmake-preset: [ release ]

    runs-on: ${{ matrix.settings.os }}

    # A hang catcher, not a budget. Measured maxima are 25 min on macOS, 34 on Ubuntu and 83
    # on Windows, hence the separate Windows bound; both sit far below GitHub's 6h default.
    timeout-minutes: ${{ (startsWith(matrix.settings.os, 'windows') && 120) || 60 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"

      - name: Setup needed software
        id: setup
        uses: ./.github/actions/setup
        with:
          os: ${{ matrix.settings.os }}
          cxx: ${{ matrix.settings.cxx }}
          cxx-standard: ${{ matrix.cxx-standard }}
          # Only master's entries are restorable from every other ref, so a topic branch that
          # writes one just fills the quota. The gate sits here, next to the triggers it reads.
          save-ccache: ${{ github.ref == 'refs/heads/master' }}

      - name: Configure CMake and Build
        env:
          CC: ${{ matrix.settings.cc }}
          CXX: ${{ matrix.settings.cxx }}
          CMAKE_CONFIG_TYPE: Release
        # Folded, not literal: the configure command passes 100 columns on one line, and a
        # shell continuation would have to differ between bash and pwsh.
        run: >-
          cmake --version

          cmake --preset ${{ matrix.cmake-preset }}
          -DCMAKE_CXX_STANDARD=${{ matrix.cxx-standard }} -L

          cmake --build --preset ${{ matrix.cmake-preset }} --verbose

      - name: CTest
        run: |
          ctest --version
          ctest --preset ${{ matrix.cmake-preset }} --extra-verbose

  # The single name the branch ruleset requires: the twelve generated matrix names would each
  # have to be mirrored there, and a removed leg would leave a context that never reports.
  ci-gate:
    needs: cmake-build-and-test
    # Without this a failing leg skips the job, and a skipped required check counts as neutral.
    if: always()
    runs-on: ubuntu-24.04

    # No checkout, no build, one comparison.
    timeout-minutes: 5

    steps:
      - name: Check the result of the matrix
        # `result` is `success` only when every leg was; a run the concurrency group cancelled
        # reports `cancelled` here and blocks, which is correct.
        env:
          RESULT: ${{ needs.cmake-build-and-test.result }}
        run: |
          echo "cmake-build-and-test: $RESULT"
          test "$RESULT" = "success"

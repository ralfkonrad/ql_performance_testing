name: "CodeQL"

on:
  schedule:
    - cron: '23 4 * * 1'
      timezone: Europe/Berlin
  workflow_dispatch: { }

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-26.04

    timeout-minutes: 90

    env:
      # Mandatory, not tidiness: the setup action exports a compiler launcher, and a cache hit
      # leaves no real compiler invocation for CodeQL's tracer, hence a near-empty database.
      CCACHE_DISABLE: '1'

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: "true"

    - name: Setup needed software
      uses: ./.github/actions/setup
      with:
        os: ubuntu-26.04
        cxx: g++
        cxx-standard: 17
        save-ccache: 'false'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: ${{ matrix.language }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        # Path filters do not apply to a compiled language that is built, so the submodules land
        # in the database regardless and the SARIF is filtered between analyze and upload-sarif.
        upload: never
        output: sarif-results

    - name: Drop the results in external/
      uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1
      with:
        patterns: |
          -external/**
        input: sarif-results/${{ matrix.language }}.sarif
        output: sarif-results/${{ matrix.language }}.sarif

    - name: Keep the filtered results with the run
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: codeql-sarif-${{ matrix.language }}
        path: sarif-results/${{ matrix.language }}.sarif

    - name: Upload the filtered results
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: sarif-results/${{ matrix.language }}.sarif
        category: "/language:${{matrix.language}}"

name: "CodeQL"

on:
  # Weekly, not per push or nightly: autobuild repeats the whole Ubuntu build without a
  # compiler cache, and this tree changes far too slowly to scan it that often.
  # push: { }
  # pull_request: { }
  schedule:
    # Monday, after the nightly build and its cache prune, and an hour clear of the two lint
    # workflows, so the week's three scheduled builds do not start on top of each other.
    - cron: '23 4 * * 1'
      timezone: Europe/Berlin
  workflow_dispatch: { }

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-26.04

    # Never run, so nothing is measured. Autobuild repeats the Ubuntu build, whose measured
    # maximum in the matrix is 34 min, uncached, and adds extraction and queries on top.
    timeout-minutes: 90

    # ccache serves a hit without ever execing the compiler, and CodeQL extracts what the
    # compiler is called on, so a hit would silently shrink the database. The setup action
    # below always names ccache as the launcher; this leaves it a pass-through wrapper.
    env:
      CCACHE_DISABLE: '1'

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # C++ is the whole tree. The matrix stays so that `category` below keeps its
        # per-language form and a second language is one entry away.
        language: [ 'cpp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: "true"

    # Autobuild configures this tree with CMake, which requires Boost; the runner image ships
    # none. Same action as the build matrix, so it is the same Boost.
    - name: Setup needed software
      uses: ./.github/actions/setup
      with:
        os: ubuntu-26.04
        # Autobuild builds with the image default, not with the matrix's clang leg.
        cxx: g++
        cxx-standard: 17
        save-ccache: 'false'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        languages: ${{ matrix.language }}

    # Autobuild's CMake detection handles this tree, so there is no build script to keep.
    - name: Autobuild
      uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

    # Held back from uploading, so that the step below can drop external/ first. The file is
    # named after the language CodeQL resolved, and `cpp` is that name, not an alias for it.
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        upload: never
        output: sarif-results

    # The submodules are compiled because our targets link them, so they land in the database
    # whatever we do; path filters are ignored for a built language. Dropping their results
    # here is what keeps external/ out of the Security tab, as .clang-format-ignore does for
    # formatting. Every result not matched by an exclusion pattern is kept.
    - name: Drop the results in external/
      uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1
      with:
        patterns: |
          -external/**
        input: sarif-results/${{ matrix.language }}.sarif
        output: sarif-results/${{ matrix.language }}.sarif

    - name: Upload the filtered results
      uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        sarif_file: sarif-results/${{ matrix.language }}.sarif
        category: "/language:${{matrix.language}}"

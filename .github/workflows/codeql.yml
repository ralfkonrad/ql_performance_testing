name: "CodeQL"

on:
  # Dispatch only: autobuild repeats the whole Ubuntu build without a compiler cache, which
  # is more runner time than a per-push or nightly scan of this tree is worth.
  # push: { }
  # pull_request: { }
  # schedule:
  #   - cron: '0 4 * * *'
  workflow_dispatch: { }

jobs:
  analyze:
    name: Analyze
    # Same image as the build matrix: autobuild configures this tree with whatever CMake the
    # image ships, so it has to be an image that satisfies the project's floor.
    runs-on: ubuntu-26.04

    # Never run, so nothing is measured. Autobuild repeats the Ubuntu build, whose measured
    # maximum in the matrix is 34 min, uncached, and adds extraction and queries on top.
    timeout-minutes: 90

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # C++ is the whole tree. The matrix stays so that `category` below keeps its
        # per-language form and a second language is one entry away.
        language: [ 'cpp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: "true"

    - name: Initialize CodeQL
      uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        languages: ${{ matrix.language }}

    # Autobuild's CMake detection handles this tree, so there is no build script to keep.
    - name: Autobuild
      uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        category: "/language:${{matrix.language}}"

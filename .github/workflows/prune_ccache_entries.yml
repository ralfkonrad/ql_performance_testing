name: Prune Superseded ccache Entries

on:
  schedule:
    - cron: '33 3 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      dry-run:
        description: List what would be deleted without deleting it.
        type: boolean
        required: false
        default: false

permissions:
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prune-ccache-entries:
    runs-on: ubuntu-26.04

    timeout-minutes: 10

    steps:
      - name: Delete superseded master ccache entries, and keys nothing restores
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        with:
          script: |
            const dryRun = process.env.DRY_RUN === 'true';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              // Only master writes entries; pull-request and topic-branch caches are
              // delete_workflow_caches.yml's job.
              { owner, repo, ref: 'refs/heads/master', per_page: 100 });

            // Matches the ISO-8601 timestamp ccache-action appends to every key it saves.
            const stamped = /-\d{4}-\d{2}-\d{2}T[\d:.]+Z?$/;

            // Deletes the last survivor too: a key stops being refreshed once the leg that wrote
            // it is gone, and its entry then holds quota nothing can restore from.
            const retiredAfterDays = 30;
            const retiredBefore = Date.now() - retiredAfterDays * 24 * 60 * 60 * 1000;

            const newest = new Map();
            const superseded = [];
            const byAgeDescending = caches
              .filter((cache) => stamped.test(cache.key))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            for (const cache of byAgeDescending) {
              const key = cache.key.replace(stamped, '');
              if (newest.has(key)) {
                superseded.push(cache);
              } else {
                newest.set(key, cache);
              }
            }

            const retired = [...newest.values()].filter(
              (cache) => new Date(cache.created_at).getTime() < retiredBefore);

            core.info(`${caches.length} cache(s) on master, ${byAgeDescending.length} of them `
                      + `ccache entries under ${newest.size} key(s); ${superseded.length} `
                      + `superseded, ${retired.length} under a key nothing restores.`);

            let deleted = 0;
            for (const cache of [...superseded, ...retired]) {
              const size = (cache.size_in_bytes / 1e6).toFixed(0);
              if (dryRun) {
                core.info(`Would delete ${cache.id} ${cache.key} (${size} MB)`);
                continue;
              }
              try {
                await github.rest.actions.deleteActionsCacheById(
                  { owner, repo, cache_id: cache.id });
                deleted += 1;
                core.info(`Deleted ${cache.id} ${cache.key} (${size} MB)`);
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                core.info(`Cache ${cache.id} was already gone.`);
              }
            }
            const doomed = superseded.length + retired.length;
            core.info(`Deleted ${deleted} of ${doomed} entry/entries.`);

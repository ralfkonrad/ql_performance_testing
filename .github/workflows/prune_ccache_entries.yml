name: Prune Superseded ccache Entries

on:
  # After the nightly build at 05:33, which is bounded at 120 min. Every master run writes a
  # new timestamped entry per leg, so without this they pile up until the quota evicts them.
  schedule:
    - cron: '33 8 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      dry-run:
        description: List what would be deleted without deleting it.
        type: boolean
        required: false
        default: false

permissions:
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prune-ccache-entries:
    runs-on: ubuntu-26.04

    timeout-minutes: 10

    steps:
      - name: Delete superseded master ccache entries, and keys nothing restores
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        with:
          script: |
            const dryRun = process.env.DRY_RUN === 'true';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Only master writes ccache entries, and only its entries are restorable from
            // every other ref.
            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              { owner, repo, ref: 'refs/heads/master', per_page: 100 });

            // hendrikmuhs/ccache-action appends an ISO timestamp to the key it is given, so
            // each run writes a new entry rather than updating one. Anything without that
            // suffix is somebody else's cache and is left alone.
            const stamped = /-\d{4}-\d{2}-\d{2}T[\d:.]+Z?$/;

            // Every master run rewrites every live key, so a key whose newest entry is this
            // stale is one nothing asks for any more — a retired runner label, compiler or
            // standard. Its survivor holds quota that no build can ever restore from.
            const retiredAfterDays = 30;
            const retiredBefore = Date.now() - retiredAfterDays * 24 * 60 * 60 * 1000;

            const newest = new Map();
            const superseded = [];
            const byAgeDescending = caches
              .filter((cache) => stamped.test(cache.key))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            for (const cache of byAgeDescending) {
              const key = cache.key.replace(stamped, '');
              if (newest.has(key)) {
                superseded.push(cache);
              } else {
                newest.set(key, cache);
              }
            }

            const retired = [...newest.values()].filter(
              (cache) => new Date(cache.created_at).getTime() < retiredBefore);

            core.info(`${caches.length} cache(s) on master, ${byAgeDescending.length} of them `
                      + `ccache entries under ${newest.size} key(s); ${superseded.length} `
                      + `superseded, ${retired.length} under a key nothing restores.`);

            let deleted = 0;
            for (const cache of [...superseded, ...retired]) {
              const size = (cache.size_in_bytes / 1e6).toFixed(0);
              if (dryRun) {
                core.info(`Would delete ${cache.id} ${cache.key} (${size} MB)`);
                continue;
              }
              try {
                await github.rest.actions.deleteActionsCacheById(
                  { owner, repo, cache_id: cache.id });
                deleted += 1;
                core.info(`Deleted ${cache.id} ${cache.key} (${size} MB)`);
              } catch (error) {
                // Only a concurrent deletion is tolerable, so that a revoked token cannot
                // report a green cleanup that deleted nothing.
                if (error.status !== 404) {
                  throw error;
                }
                core.info(`Cache ${cache.id} was already gone.`);
              }
            }
            const doomed = superseded.length + retired.length;
            core.info(`Deleted ${deleted} of ${doomed} entry/entries.`);

name: Delete Workflow Caches

on:
  # GitHub never reclaims the caches of a closed pull request or a deleted branch, and the
  # repository shares one 10GB quota; once it is full the master entries get evicted too.
  #
  # `pull_request_target`, not `pull_request`: a fork pull request's token is read-only
  # whatever the `permissions` block says, so every deletion would 403 into a green job.
  # Nothing from the pull request is checked out or run here, only the cache API is called.
  pull_request_target:
    types: [ closed ]
  delete: { }
  workflow_dispatch:
    inputs:
      ref:
        description: Ref whose caches to delete, e.g. refs/heads/master, or ALL for every one.
        required: true
        default: ''

permissions:
  actions: write

# Keyed on the ref, so closing two pull requests in a row does not drop the first cleanup.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ (github.event_name == 'delete' && github.event.ref)
    || (github.event_name == 'pull_request_target' && github.event.number)
    || inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  delete-workflow-caches:
    # A deleted tag has no caches of its own.
    if: github.event_name != 'delete' || github.event.ref_type == 'branch'
    runs-on: ubuntu-24.04

    timeout-minutes: 10

    # `&&` binds tighter than `||`, so each event picks its own branch; a manual run falls
    # through to the input, which the script below requires to name a ref or say ALL.
    env:
      CACHE_REF: >-
        ${{ (github.event_name == 'delete' && format('refs/heads/{0}', github.event.ref))
        || (github.event_name == 'pull_request_target'
        && format('refs/pull/{0}/merge', github.event.number))
        || inputs.ref }}

    steps:
      - name: Delete the caches of the ref
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            let ref = (process.env.CACHE_REF || '').trim();
            if (!ref) {
              // `required: true` is satisfied by the empty string the form is pre-filled
              // with, and empty would mean every cache of the repository, master's included.
              core.setFailed('Name a ref whose caches to delete, or ALL for every one.');
              return;
            }
            if (ref === 'ALL') {
              ref = '';
            } else if (!ref.startsWith('refs/')) {
              // The caches API matches a fully qualified ref only; an unqualified one is
              // not rejected, it just matches nothing.
              core.info(`Qualifying '${ref}' as 'refs/heads/${ref}'.`);
              ref = `refs/heads/${ref}`;
            }
            core.info(ref ? `Deleting the caches of ${ref}.`
                          : 'Deleting every cache of the repository.');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const params = { owner, repo, per_page: 100 };
            if (ref) {
              params.ref = ref;
            }

            // No map function: paginate already replaces response.data with the inner
            // actions_caches array, so reading .actions_caches off it yields undefined
            // once per page and the loop below then dereferences undefined.id.
            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList, params);
            core.info(`Found ${caches.length} cache(s).`);

            let deleted = 0;
            for (const cache of caches) {
              try {
                await github.rest.actions.deleteActionsCacheById(
                  { owner, repo, cache_id: cache.id });
                deleted += 1;
                core.info(`Deleted ${cache.id} ${cache.ref} ${cache.key}`);
              } catch (error) {
                // Only a concurrent deletion is tolerable, so that a revoked token cannot
                // report a green cleanup that deleted nothing.
                if (error.status !== 404) {
                  throw error;
                }
                core.info(`Cache ${cache.id} was already gone.`);
              }
            }
            core.info(`Deleted ${deleted} of ${caches.length} cache(s).`);

name:
  Setup
description:
  Setup of the needed software

inputs:
  os:
    description: The os for the run.
    required: true

  cxx:
    description: The c++ compiler to use.
    required: true

  cxx-standard:
    description: The c++ standard to use.
    required: true

  cxx-apt-package:
    description:
      An apt package holding the compiler named by `cxx`, e.g. `g++-14` or `clang-21`,
      installed before anything reads a compiler version. Empty, the default, uses whatever the
      image ships. Linux only, because the other two images have no second toolchain to install.
    required: false
    default: ''

  save-ccache:
    description:
      Whether this job may write its compiler cache back. The caller decides, so that moving
      the gate is a one-token edit next to the matrix rather than a change in here. It
      defaults to false, so a caller that forgets it loses cache writes but cannot fill the
      quota.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Determine ccache variant
      id: ccache-variant
      shell: bash
      run: |
        variant="${{ ( (runner.os == 'Windows') && 'sccache' ) || 'ccache' }}"
        echo "CMAKE_CXX_COMPILER_LAUNCHER=$variant" >> $GITHUB_ENV
        echo "variant=$variant" >> $GITHUB_OUTPUT

    - name: Setup Linux variables
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> $GITHUB_PATH

    - name: Setup Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build

        brew update
        brew install boost

    - name: Install the requested compiler on Linux
      if: runner.os == 'Linux' && inputs.cxx-apt-package != ''
      shell: bash
      run: |
        package='${{ inputs.cxx-apt-package }}'

        if ! apt-cache show "$package" > /dev/null 2>&1; then
          case "$package" in
            g++-*)
              sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
              ;;
            clang-*)
              version="${package#clang-}"
              wget -qO "$RUNNER_TEMP/llvm.sh" https://apt.llvm.org/llvm.sh
              chmod +x "$RUNNER_TEMP/llvm.sh"
              sudo "$RUNNER_TEMP/llvm.sh" "$version"
              exit 0
              ;;
            *)
              echo "::error::cxx-apt-package must name a g++-* or clang-* package, not $package"
              exit 1
              ;;
          esac
          sudo apt-get update
        fi

        sudo apt-get install -y "$package"

    - name: Setup build variables on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "CXXFLAGS=-stdlib=libc++" >> $GITHUB_ENV

    - name: Setup macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        formulae=(ninja boost)
        missing=()
        outdated=()

        for formula in "${formulae[@]}"; do
          if brew list --formula --versions "$formula" > /dev/null 2>&1; then
            if [ -n "$(brew outdated --formula --quiet "$formula")" ]; then
              outdated+=("$formula")
            fi
          else
            missing+=("$formula")
          fi
        done

        [ ${#missing[@]} -eq 0 ] || brew install "${missing[@]}"
        [ ${#outdated[@]} -eq 0 ] || brew upgrade "${outdated[@]}"

    - name: Setup Windows variables
      id: windows-variables
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $boostVersion = '1.88.0'
        $boostUnderscored = $boostVersion.Replace('.', '_')
        $msvcToolset = '14.3'

        $baseUri = 'https://downloads.sourceforge.net/project/boost/boost-binaries'
        $installerName = "boost_$boostUnderscored-msvc-$msvcToolset-64.exe"
        $installDir = "$env:RUNNER_TEMP\boost"
        $boostDir = "$installDir\lib64-msvc-$msvcToolset\cmake\Boost-$boostVersion"
        $downloadUri = "$baseUri/$boostVersion/$installerName"

        $uriBytes = [System.Text.Encoding]::UTF8.GetBytes($downloadUri)
        $uriHash = [System.Security.Cryptography.SHA256]::HashData($uriBytes)
        $uriDigest = [System.Convert]::ToHexString($uriHash).ToLowerInvariant()

        $installerPath = "$env:RUNNER_TEMP\boost.exe"

        Write-Output "BOOST_DOWNLOAD_URI=$downloadUri" >> $env:GITHUB_ENV
        Write-Output "BOOST_INSTALLER_PATH=$installerPath" >> $env:GITHUB_ENV
        Write-Output "BOOST_INSTALL_DIR=$installDir" >> $env:GITHUB_ENV
        Write-Output "Boost_DIR=$boostDir" >> $env:GITHUB_ENV

        Write-Output "installer-path=$installerPath" >> $env:GITHUB_OUTPUT
        Write-Output "uri-digest=$uriDigest" >> $env:GITHUB_OUTPUT

    - name: Restore the cached Boost installer on Windows
      id: cache-boost-installer
      if: runner.os == 'Windows'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.windows-variables.outputs.installer-path }}
        key: boost-installer-${{ steps.windows-variables.outputs.uri-digest }}

    - name: Download Boost on Windows
      if: runner.os == 'Windows' && steps.cache-boost-installer.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $uri = $env:BOOST_DOWNLOAD_URI
        $exe = $env:BOOST_INSTALLER_PATH
        $maxAttempts = 3

        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
          try {
            Write-Host "Downloading $uri (attempt $attempt of $maxAttempts)"
            Start-BitsTransfer -Source $uri -Destination $exe `
              -RetryInterval 60 -RetryTimeout 300 -ErrorAction Stop
            break
          }
          catch {
            Write-Warning "Downloading $uri failed: $($_.Exception.Message)"
            Remove-Item -LiteralPath $exe -Force -ErrorAction SilentlyContinue
            if ($attempt -eq $maxAttempts) {
              throw "Boost download from $uri failed after $maxAttempts attempts."
            }
            Start-Sleep -Seconds (30 * $attempt)
          }
        }

    - name: Setup Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $exe = $env:BOOST_INSTALLER_PATH

        if (-not (Test-Path -LiteralPath $exe)) {
          throw "No Boost installer at $exe."
        }
        $installerBytes = (Get-Item -LiteralPath $exe).Length
        if ($installerBytes -lt 50MB) {
          Remove-Item -LiteralPath $exe -Force -ErrorAction SilentlyContinue
          throw "The Boost installer at $exe is only $installerBytes bytes."
        }

        $installArgs = @('/SILENT', '/SP-', '/SUPPRESSMSGBOXES', "/DIR=$env:BOOST_INSTALL_DIR")
        $process = Start-Process -Wait -PassThru -FilePath $exe -ArgumentList $installArgs
        if ($process.ExitCode -ne 0) {
          throw "Boost installer failed with exit code $($process.ExitCode)."
        }

        if (-not (Test-Path -LiteralPath $env:Boost_DIR)) {
          throw "Boost install left no CMake package directory at $env:Boost_DIR."
        }

        choco install -y ninja

    - name: Set up Visual Studio shell on Windows
      uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
      if: runner.os == 'Windows'
      with:
        arch: x64

    - name: Ensure CMake meets the floor
      shell: bash
      run: |
        floor=4.0
        have=$(cmake --version | head -1 | awk '{ print $3 }')
        echo "cmake: $have (floor $floor)"

        if [ "$(printf '%s\n%s\n' "$floor" "$have" | sort -V | head -1)" = "$floor" ]; then
          exit 0
        fi

        case "$RUNNER_OS" in
          Linux | macOS)
            if brew list --formula --versions cmake > /dev/null 2>&1; then
              brew upgrade cmake
            else
              brew install cmake
            fi
            ;;
          Windows)
            choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System'
            echo 'C:\Program Files\CMake\bin' >> "$GITHUB_PATH"
            ;;
        esac

    - name: Determine the compiler cache key
      id: cache-key
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          version=$(cl 2>&1 | head -1 || true)
        else
          version=$(${{ inputs.cxx }} --version | head -1)
        fi
        if [ -z "$version" ]; then
          echo "::error::could not read a version from ${{ inputs.cxx }}"
          exit 1
        fi
        echo "compiler: $version"
        if command -v sha256sum > /dev/null; then
          digest=$(printf '%s' "$version" | sha256sum)
        else
          digest=$(printf '%s' "$version" | shasum -a 256)
        fi
        base="${{ inputs.os }}-${{ runner.arch }}-${{ inputs.cxx }}-cc${digest:0:12}"
        echo "key=$base-std-${{ inputs.cxx-standard }}" >> $GITHUB_OUTPUT
        echo "prefix=$base-std" >> $GITHUB_OUTPUT

    - name: Setup CCache
      uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: |
          ${{ steps.cache-key.outputs.key }}
          ${{ steps.cache-key.outputs.prefix }}
        variant: ${{ steps.ccache-variant.outputs.variant }}
        max-size: ${{ ( (runner.os == 'Windows') && '400M' ) || '250M' }}
        evict-old-files: 7d
        save: ${{ inputs.save-ccache }}


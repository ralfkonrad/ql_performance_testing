name:
  Setup
description:
  Setup of the needed software

inputs:
  os:
    description: The os for the run.
    required: true

  cxx:
    description: The c++ compiler to use.
    required: true

  cxx-standard:
    description: The c++ standard to use.
    required: true

  save-ccache:
    description:
      Whether this job may write its compiler cache back. The caller decides, so that moving
      the gate is a one-token edit next to the matrix rather than a change in here. It
      defaults to false, so a caller that forgets it loses cache writes but cannot fill the
      quota.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Determine ccache variant
      shell: bash
      run: |
        variant="${{ ( (runner.os == 'Windows') && 'sccache' ) || 'ccache' }}"
        echo "CMAKE_CXX_COMPILER_LAUNCHER=$variant" >> $GITHUB_ENV

    - name: Setup Linux variables
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> $GITHUB_PATH

    - name: Setup Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        # ccache is provided by hendrikmuhs/ccache-action below; installing it here as well
        # only shadows the action's build with an older apt one.
        sudo apt-get install -y ninja-build

        brew update
        brew install boost

    - name: Setup build variables on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # Do not reintroduce HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: this action never runs
        # `brew upgrade`, so it silences nothing and Homebrew annotates every job that sets it.
        echo "CXXFLAGS=-stdlib=libc++" >> $GITHUB_ENV

    - name: Setup macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install ninja boost

    - name: Setup Windows variables
      id: windows-variables
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # The Boost version and the MSVC toolset are stated once here; the download URI and
        # every path are derived from them, so a bump cannot leave a stale copy behind.
        $boostVersion = '1.88.0'
        $boostUnderscored = $boostVersion.Replace('.', '_')
        $msvcToolset = '14.3'

        $baseUri = 'https://downloads.sourceforge.net/project/boost/boost-binaries'
        $installerName = "boost_$boostUnderscored-msvc-$msvcToolset-64.exe"
        $installDir = "$env:RUNNER_TEMP\boost"
        $boostDir = "$installDir\lib64-msvc-$msvcToolset\cmake\Boost-$boostVersion"
        $downloadUri = "$baseUri/$boostVersion/$installerName"

        # The cache key is the SHA-256 of the download URI, not the URI itself: cache keys are
        # prefix-matched and a raw URI's '/' and ':' make an unreadable key. Hashing keeps the
        # key a pure function of the URI, so bumping $boostVersion misses the cache without a
        # version string being repeated anywhere.
        $uriBytes = [System.Text.Encoding]::UTF8.GetBytes($downloadUri)
        $uriHash = [System.Security.Cryptography.SHA256]::HashData($uriBytes)
        $uriDigest = [System.Convert]::ToHexString($uriHash).ToLowerInvariant()

        $installerPath = "$env:RUNNER_TEMP\boost.exe"

        Write-Output "BOOST_DOWNLOAD_URI=$downloadUri" >> $env:GITHUB_ENV
        Write-Output "BOOST_INSTALLER_PATH=$installerPath" >> $env:GITHUB_ENV
        Write-Output "BOOST_INSTALL_DIR=$installDir" >> $env:GITHUB_ENV
        Write-Output "Boost_DIR=$boostDir" >> $env:GITHUB_ENV

        # The cache step reads these as step outputs rather than from the env context, which
        # the composite action documentation does not promise for a step's `with`.
        Write-Output "installer-path=$installerPath" >> $env:GITHUB_OUTPUT
        Write-Output "uri-digest=$uriDigest" >> $env:GITHUB_OUTPUT

    - name: Restore the cached Boost installer on Windows
      id: cache-boost-installer
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: ${{ steps.windows-variables.outputs.installer-path }}
        key: boost-installer-${{ steps.windows-variables.outputs.uri-digest }}

    - name: Download Boost on Windows
      if: runner.os == 'Windows' && steps.cache-boost-installer.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        # SourceForge mirrors regularly drop the connection mid-transfer, so retry instead of
        # failing the job on the first error. -RetryTimeout also bounds BITS itself: its
        # 14-day default window keeps a hopeless transfer alive far past any useful runtime.
        $uri = $env:BOOST_DOWNLOAD_URI
        $exe = $env:BOOST_INSTALLER_PATH
        $maxAttempts = 3

        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
          try {
            Write-Host "Downloading $uri (attempt $attempt of $maxAttempts)"
            Start-BitsTransfer -Source $uri -Destination $exe `
              -RetryInterval 60 -RetryTimeout 300 -ErrorAction Stop
            break
          }
          catch {
            Write-Warning "Downloading $uri failed: $($_.Exception.Message)"
            # A partial file must not survive into the next attempt or into the cache.
            Remove-Item -LiteralPath $exe -Force -ErrorAction SilentlyContinue
            if ($attempt -eq $maxAttempts) {
              throw "Boost download from $uri failed after $maxAttempts attempts."
            }
            Start-Sleep -Seconds (30 * $attempt)
          }
        }

        # Start-BitsTransfer reports success even when a SourceForge mirror answers with an
        # HTML error page, so check that what landed can plausibly be the installer.
        if (-not (Test-Path -LiteralPath $exe)) {
          throw "Boost download from $uri produced no file at $exe."
        }
        $downloadedBytes = (Get-Item -LiteralPath $exe).Length
        if ($downloadedBytes -lt 50MB) {
          throw "Boost download is only $downloadedBytes bytes, not a Boost installer."
        }

    - name: Setup Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # A cache hit restores the installer but installs nothing, so this step runs on both
        # the cache-hit and the download path.
        $exe = $env:BOOST_INSTALLER_PATH

        # Without -PassThru the installer's exit code is discarded and a failed Boost install
        # stays green until the caller's CMake fails to find Boost.
        $installArgs = @('/SILENT', '/SP-', '/SUPPRESSMSGBOXES', "/DIR=$env:BOOST_INSTALL_DIR")
        $process = Start-Process -Wait -PassThru -FilePath $exe -ArgumentList $installArgs
        if ($process.ExitCode -ne 0) {
          throw "Boost installer failed with exit code $($process.ExitCode)."
        }

        # Boost_DIR is the tree the caller's CMake consumes; fail here rather than there.
        if (-not (Test-Path -LiteralPath $env:Boost_DIR)) {
          throw "Boost install left no CMake package directory at $env:Boost_DIR."
        }

        choco install -y ninja

    - name: Set up Visual Studio shell on Windows
      uses: TheMrMilchmann/setup-msvc-dev@v4
      if: runner.os == 'Windows'
      with:
        arch: x64

    - name: Setup CCache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        # Restore keys are prefix-matched, so no rung may be a prefix of a sibling variant's
        # key. The architecture separates a runner from its `-arm` counterpart, and the
        # compiler sits ahead of the standard so a g++ job cannot restore a clang++ entry and
        # store the merged result back under its own key. The only fallback left is the same
        # os, architecture and compiler at another standard, which is a real prefix and the
        # one worth keeping. The action prepends the variant and appends a timestamp itself.
        key: ${{ inputs.os }}-${{ runner.arch }}-${{ inputs.cxx }}-std-${{ inputs.cxx-standard }}
        restore-keys: |
          ${{ inputs.os }}-${{ runner.arch }}-${{ inputs.cxx }}-std-${{ inputs.cxx-standard }}
          ${{ inputs.os }}-${{ runner.arch }}-${{ inputs.cxx }}-std-
        variant: ${{ env.CMAKE_CXX_COMPILER_LAUNCHER }}
        # Both variants read the last character as the unit and sccache silently falls back
        # to its own 10GB default for a size it cannot parse, so the unit must be `M` and not
        # `MB`. Windows entries are by far the largest, hence the wider cap there.
        max-size: ${{ ( (runner.os == 'Windows') && '400M' ) || '250M' }}
        # ccache only; the action skips it for sccache, where max-size does the bounding.
        evict-old-files: 7d
        save: ${{ inputs.save-ccache }}


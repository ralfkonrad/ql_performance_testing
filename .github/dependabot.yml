version: 2
updates:
  # No "gitsubmodule" ecosystem on purpose: external/QuantLib tracks our own fork, and every
  # submodule pointer is moved by hand rather than by a bot.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      # The composite action is a second manifest location: the "/" entry alone
      # never sees the actions pinned inside it.
      - "/.github/actions/**"
    schedule:
      interval: "daily"
      time: "01:46"
      timezone: "Europe/Berlin"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
